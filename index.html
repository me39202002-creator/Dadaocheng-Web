        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.innerHTML = i18n[lang][key]; 
            });

            // 處理 input placeholder 的多語系切換
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });

            const langSelect = document.getElementById('lang-select');
            if (langSelect) langSelect.value = lang;
            localStorage.setItem('dadaocheng_lang', lang);
            if (shopData.length > 0) renderCards();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 語系初始化
            const savedLang = localStorage.getItem('dadaocheng_lang') || 'zh';
            changeLanguage(savedLang);

            document.getElementById('lang-select').addEventListener('change', (e) => {
                changeLanguage(e.target.value);
            });

            // 漢堡選單切換邏輯
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const navMenu = document.getElementById('nav-menu');
            const hamburgerIcon = hamburgerBtn ? hamburgerBtn.querySelector('i') : null;

            if (hamburgerBtn && navMenu && hamburgerIcon) {
                hamburgerBtn.addEventListener('click', () => {
                    navMenu.classList.toggle('hidden');
                    navMenu.classList.toggle('flex');
                    
                    if (navMenu.classList.contains('hidden')) {
                        hamburgerIcon.classList.remove('fa-xmark');
                        hamburgerIcon.classList.add('fa-bars');
                    } else {
                        hamburgerIcon.classList.remove('fa-bars');
                        hamburgerIcon.classList.add('fa-xmark');
                    }
                });
            }

            // 深淺色模式切換邏輯
            const themeToggleBtn = document.getElementById('theme-toggle');
            themeToggleBtn.addEventListener('click', function() {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    localStorage.theme = 'dark';
                } else {
                    localStorage.theme = 'light';
                }
            });

            // 處理標籤點擊事件 (更新為圓形按鈕的樣式切換)
            const filterContainer = document.getElementById('filter-carousel');
            if (filterContainer) {
                filterContainer.addEventListener('click', (e) => {
                    const clickedBtn = e.target.closest('.filter-tag');
                    if (!clickedBtn) return;

                    const allBtns = filterContainer.querySelectorAll('.filter-tag');
                    allBtns.forEach(btn => {
                        // 移除 Active 樣式
                        btn.classList.remove('border-primary', 'dark:border-accent', 'bg-primary', 'dark:bg-accent', 'text-white', 'font-bold');
                        // 加上 Inactive 樣式
                        btn.classList.add('border-ink/10', 'dark:border-dark-ink/20', 'bg-white', 'dark:bg-dark-card', 'text-ink', 'dark:text-dark-ink', 'font-medium');
                    });

                    // 為被點擊的按鈕加上 Active 樣式
                    clickedBtn.classList.remove('border-ink/10', 'dark:border-dark-ink/20', 'bg-white', 'dark:bg-dark-card', 'text-ink', 'dark:text-dark-ink', 'font-medium');
                    clickedBtn.classList.add('border-primary', 'dark:border-accent', 'bg-primary', 'dark:bg-accent', 'text-white', 'font-bold');

                    currentCategory = clickedBtn.getAttribute('data-category');
                    currentPage = 1; 
                    renderCards();
                });
            }

            // -----------------------------------------------------
            // 輪播圖無限循環與左右按鈕、手機滑動邏輯
            // -----------------------------------------------------
            const carousel = document.getElementById('filter-carousel');
            const slideLeft = document.getElementById('slide-left');
            const slideRight = document.getElementById('slide-right');
            let isAnimating = false; // 防止連續點擊造成動畫錯亂

            function moveRight() {
                if (isAnimating || !carousel) return;
                isAnimating = true;
                const firstItem = carousel.firstElementChild;
                const itemWidth = firstItem.offsetWidth;

                // 加上 CSS 動畫並向左滑動
                carousel.style.transition = 'transform 0.3s ease-in-out';
                carousel.style.transform = `translateX(-${itemWidth}px)`;

                // 動畫結束後，把第一個元素搬到最後面，並瞬間把 transform 歸零
                setTimeout(() => {
                    carousel.style.transition = 'none';
                    carousel.style.transform = 'translateX(0)';
                    carousel.appendChild(firstItem);
                    isAnimating = false;
                }, 300);
            }

            function moveLeft() {
                if (isAnimating || !carousel) return;
                isAnimating = true;
                const lastItem = carousel.lastElementChild;
                const itemWidth = lastItem.offsetWidth;

                // 先把最後一個元素搬到最前面，並瞬間將整個容器向左偏移 (隱藏搬移痕跡)
                carousel.prepend(lastItem);
                carousel.style.transition = 'none';
                carousel.style.transform = `translateX(-${itemWidth}px)`;

                // 強制瀏覽器重繪 (Force Reflow)，讓它確實套用上述無動畫的位置
                void carousel.offsetWidth;

                // 加上 CSS 動畫，將容器滑回原本的 0 座標位置
                carousel.style.transition = 'transform 0.3s ease-in-out';
                carousel.style.transform = 'translateX(0)';

                setTimeout(() => {
                    isAnimating = false;
                }, 300);
            }

            if (carousel && slideLeft && slideRight) {
                slideLeft.addEventListener('click', moveLeft);
                slideRight.addEventListener('click', moveRight);

                // 支援手機觸控滑動 (Swipe)
                let startX = 0;
                let endX = 0;
                carousel.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                }, { passive: true });

                carousel.addEventListener('touchend', (e) => {
                    endX = e.changedTouches[0].clientX;
                    // 滑動距離超過 30px 才觸發
                    if (startX - endX > 30) {
                        moveRight(); // 往左滑 (看右邊的東西)
                    } else if (endX - startX > 30) {
                        moveLeft();  // 往右滑 (看左邊的東西)
                    }
                }, { passive: true });
            }

            // 監聽搜尋框輸入事件
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.trim().toLowerCase();
                    currentPage = 1; // 重新搜尋時自動回到第一頁
                    renderCards();
                });
            }

            // 抓取最後更新時間
            fetch('data.json', { method: 'HEAD' })
                .then(response => {
                    const lastModified = response.headers.get('Last-Modified');
                    const timeEl = document.getElementById('update-time');
                    if (lastModified && timeEl) {
                        const date = new Date(lastModified);
                        timeEl.innerText = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                    } else if (timeEl) timeEl.innerText = '近期';
                })
                .catch(() => {
                    const timeEl = document.getElementById('update-time');
                    if (timeEl) timeEl.innerText = '未知';
                });
        });

        // 讀取 JSON 資料
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('無法讀取檔案');
                return response.json();
            })
            .then(data => {
                shopData = data; 
                renderCards();   
            })
            .catch(error => {
                console.error('獲取 JSON 失敗:', error);
                document.getElementById('card-grid').innerHTML = 
                    `<p class="col-span-full text-center text-red-500 font-bold p-10 border-2 border-red-200 rounded-xl bg-red-50 dark:bg-red-900/20 dark:border-red-800">資料讀取失敗！請確認是否使用本機伺服器 (Live Server) 開啟。</p>`;
            });

        function renderCards() {
            const cardGrid = document.getElementById('card-grid');
            
            let filteredData = shopData;
            
            // 處理分類過濾
            if (currentCategory !== 'all') {
                filteredData = filteredData.filter(item => {
                    return item.Category === currentCategory;
                });
            }

            // 處理關鍵字過濾 (比對標題、描述、地址)
            if (searchQuery) {
                const langKey = currentLang.toUpperCase(); 
                filteredData = filteredData.filter(item => {
                    const title = (item[`Title (${langKey})`] || item[`Title (ZH)`] || '').toLowerCase();
                    const desc = (item[`Description (${langKey})`] || item[`Description (ZH)`] || '').toLowerCase();
                    const address = (item[`Address (${langKey})`] || item[`Address (ZH)`] || '').toLowerCase();
                    
                    return title.includes(searchQuery) || desc.includes(searchQuery) || address.includes(searchQuery);
                });
            }

            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / cardsPerPage);
            const startIndex = (currentPage - 1) * cardsPerPage;
            const endIndex = startIndex + cardsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);

            const langKey = currentLang.toUpperCase(); 
            
            // 批次渲染卡片 HTML (適配深色模式)
            const cardsHtml = paginatedData.map(item => {
                const title = item[`Title (${langKey})`] || item[`Title (ZH)`];
                const address = item[`Address (${langKey})`] || item[`Address (ZH)`];
                const hours = item[`Hours (${langKey})`] || item[`Hours (ZH)`];
                const desc = item[`Description (${langKey})`] || item[`Description (ZH)`];
                // 如果是卡片上的小標籤，我們不顯示 <br>，直接取翻譯並移除 <br> 標籤
                let tagText = i18n[currentLang][`tag-${item.Category}`] || item.Category;
                tagText = tagText.replace('<br>', '');
                
                const searchKeyword = encodeURIComponent(item['Title (ZH)'] + ' ' + item['Address (ZH)']);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;

                return `
                    <div class="group relative bg-white dark:bg-dark-card p-7 rounded-xl border-2 border-ink/10 dark:border-dark-ink/20 hover:border-ink dark:hover:border-dark-ink shadow-[4px_4px_0px_0px_rgba(51,51,51,0.05)] dark:shadow-[4px_4px_0px_0px_rgba(239,235,227,0.05)] hover:shadow-[6px_6px_0px_0px_rgba(51,51,51,0.9)] dark:hover:shadow-[6px_6px_0px_0px_rgba(239,235,227,0.3)] transition-all duration-300 flex flex-col hover:-translate-y-1 overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-tag-bg dark:from-dark-tag to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none z-0"></div>
                        <span class="bg-tag-bg dark:bg-dark-tag text-tag-text dark:text-accent text-xs font-bold px-3 py-1 rounded-sm self-start mb-5 relative z-10 border border-tag-text/20 dark:border-accent/20 tracking-widest transition-colors duration-500">${tagText}</span>
                        <h3 class="text-2xl font-serif font-bold text-ink dark:text-dark-ink mb-3 relative z-10 group-hover:text-primary dark:group-hover:text-accent transition-colors duration-300 break-words">${title}</h3>
                        <p class="text-ink-light dark:text-gray-400 text-sm flex-grow mb-6 relative z-10 leading-relaxed transition-colors duration-500 break-words">${desc}</p>
                        <div class="text-sm text-ink dark:text-dark-ink flex flex-col gap-3 mt-auto relative z-10 border-t border-ink/10 dark:border-dark-ink/10 pt-5 transition-colors duration-500">
                            <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="group/link flex items-start gap-2 hover:text-primary dark:hover:text-accent transition-colors duration-300">
                                <i class="fa-solid fa-location-dot text-accent mt-1 group-hover/link:animate-bounce"></i> 
                                <span class="underline decoration-ink/20 dark:decoration-dark-ink/20 underline-offset-4 group-hover/link:decoration-primary dark:group-hover:decoration-accent leading-tight break-all">${address}</span>
                            </a>
                            <div class="flex items-center gap-2 text-ink-light dark:text-gray-400 transition-colors duration-500">
                                <i class="fa-regular fa-clock text-accent"></i> ${hours}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            cardGrid.innerHTML = cardsHtml;
            updatePagination(totalItems, totalPages);
        }

        // 修改為下拉式選單風格的分頁元件
        function updatePagination(totalItems, totalPages) {
            const paginationNumbers = document.getElementById('pagination-numbers');
            const pageInfo = document.getElementById('page-info');
            paginationNumbers.innerHTML = '';
            
            // 使用 flex-wrap 確保在手機極小螢幕上按鈕也會自動換行排版
            paginationNumbers.className = "flex flex-wrap gap-3 items-center justify-center w-full";

            if (totalItems === 0) {
                pageInfo.innerText = i18n[currentLang]['page-text'].replace('{start}', 0).replace('{end}', 0).replace('{total}', 0);
                return;
            }

            const textPrev = i18n[currentLang]['prev-page'] || '上一頁';
            const textNext = i18n[currentLang]['next-page'] || '下一頁';
            const textPage = i18n[currentLang]['page-unit'] || '頁';

            // 上一頁按鈕
            const prevDisabled = currentPage === 1;
            const prevBtn = document.createElement('button');
            prevBtn.className = `px-4 py-2 rounded-md font-bold transition-all duration-200 ${
                prevDisabled 
                ? 'bg-gray-100 dark:bg-white/5 border border-transparent text-gray-400 dark:text-gray-600 cursor-not-allowed' 
                : 'bg-white dark:bg-dark-card border border-ink/20 dark:border-dark-ink/20 text-ink dark:text-dark-ink hover:bg-black/5 dark:hover:bg-white/10 shadow-sm'
            }`;
            prevBtn.innerText = textPrev;
            prevBtn.disabled = prevDisabled;
            if (!prevDisabled) prevBtn.onclick = () => { 
                currentPage--; 
                renderCards(); 
                window.scrollTo({ top: document.getElementById('search-input').offsetTop - 100, behavior: 'smooth' });
            };
            paginationNumbers.appendChild(prevBtn);

            // 下拉選單 (第X頁)
            const selectWrap = document.createElement('div');
            selectWrap.className = 'relative';
            
            const selectEl = document.createElement('select');
            selectEl.className = 'appearance-none pl-4 pr-8 py-2 rounded-md border border-ink/20 dark:border-dark-ink/20 bg-white dark:bg-dark-card text-ink dark:text-dark-ink font-bold focus:outline-none focus:ring-2 focus:ring-accent/50 cursor-pointer shadow-sm';
            
            for (let i = 1; i <= totalPages; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = currentLang === 'en' ? `${textPage}${i}` : `${i} ${textPage}`;
                if (i === currentPage) opt.selected = true;
                selectEl.appendChild(opt);
            }
            
            selectEl.onchange = (e) => {
                currentPage = parseInt(e.target.value, 10);
                renderCards();
                window.scrollTo({ top: document.getElementById('search-input').offsetTop - 100, behavior: 'smooth' });
            };

            selectWrap.appendChild(selectEl);
            
            // 下拉選單的小箭頭圖示
            const arrowIcon = document.createElement('i');
            arrowIcon.className = 'fa-solid fa-caret-down absolute right-3 top-1/2 transform -translate-y-1/2 text-ink-light dark:text-gray-400 pointer-events-none';
            selectWrap.appendChild(arrowIcon);

            paginationNumbers.appendChild(selectWrap);

            // 下一頁按鈕
            const nextDisabled = currentPage === totalPages;
            const nextBtn = document.createElement('button');
            nextBtn.className = `px-4 py-2 rounded-md font-bold transition-all duration-200 ${
                nextDisabled 
                ? 'bg-gray-100 dark:bg-white/5 border border-transparent text-gray-400 dark:text-gray-600 cursor-not-allowed' 
                : 'bg-white dark:bg-dark-card border border-ink/20 dark:border-dark-ink/20 text-ink dark:text-dark-ink hover:bg-black/5 dark:hover:bg-white/10 shadow-sm'
            }`;
            nextBtn.innerText = textNext;
            nextBtn.disabled = nextDisabled;
            if (!nextDisabled) nextBtn.onclick = () => { 
                currentPage++; 
                renderCards(); 
                window.scrollTo({ top: document.getElementById('search-input').offsetTop - 100, behavior: 'smooth' });
            };
            paginationNumbers.appendChild(nextBtn);

            const startStr = (currentPage - 1) * cardsPerPage + 1;
            const endStr = Math.min(currentPage * cardsPerPage, totalItems);
            pageInfo.className = "text-ink-light dark:text-gray-400 text-sm font-medium mt-4 tracking-wide transition-colors duration-500";
            pageInfo.innerText = i18n[currentLang]['page-text']
                .replace('{start}', startStr)
                .replace('{end}', endStr)
                .replace('{total}', totalItems);
        }
    </script>
