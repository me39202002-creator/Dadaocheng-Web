<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特色店家 - 大稻埕特色店家 Dadaocheng Guide</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 新增：地址連結的滑鼠懸停效果 */
        .map-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .map-link:hover {
            color: var(--primary-bg); /* 滑鼠移過去變成深紅棕色 */
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header-container">
        <div class="top-nav">
            <div class="logo-area">
                <div class="logo-icon">D</div>
                <div class="logo-text">
                    <div class="title" data-i18n="site-title">大稻埕特色店家</div>
                    <div class="subtitle">Dadaocheng Guide</div>
                </div>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active" data-i18n="nav-shops">特色店家</a>
                <a href="history.html" data-i18n="nav-history">大稻埕的歷史</a>
                <a href="apps.html" data-i18n="nav-apps">必備APP推薦</a>
                <a href="emergency.html" data-i18n="nav-emergency">緊急協助</a>
            </nav>
            <div class="language-select">
                Language : 
                <select id="lang-select">
                    <option value="zh">繁體中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- 標籤分類 -->
        <div class="filter-tags" id="filter-container">
            <button class="filter-tag active" data-category="all" data-i18n="cat-all">全部</button>
            <button class="filter-tag" data-category="coffee" data-i18n="cat-coffee">咖啡</button>
            <button class="filter-tag" data-category="tea" data-i18n="cat-tea">茶館</button>
            <button class="filter-tag" data-category="restaurant" data-i18n="cat-rest">餐廳</button>
            <button class="filter-tag" data-category="craft" data-i18n="cat-craft">文創選物</button>
            <button class="filter-tag" data-category="pastry" data-i18n="cat-pastry">傳統糕餅</button>
            <button class="filter-tag" data-category="medicine" data-i18n="cat-med">中藥行</button>
            <button class="filter-tag" data-category="snack" data-i18n="cat-snack">小吃飲品</button>
            <button class="filter-tag" data-category="bar" data-i18n="cat-bar">酒吧</button>
            <button class="filter-tag" data-category="culture" data-i18n="cat-culture">文化</button>
        </div>

        <!-- 卡片列表 (由 JS 動態生成) -->
        <div class="card-grid" id="card-grid">
            <!-- 讀取中提示 -->
            <p style="grid-column: 1/-1; text-align: center; color: #666;">資料載入中，請稍候...</p>
        </div>

        <!-- 分頁 -->
        <div class="pagination">
            <div class="page-numbers" id="pagination-numbers"></div>
            <div class="page-info" id="page-info">總共第 0 到 0 筆，共 0 筆</div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-top">
            <div class="footer-col">
                <h4><div class="logo-icon">D</div> <span data-i18n="site-title">大稻埕特色店家</span></h4>
                <p data-i18n="footer-desc1">本指南由社群共編，持續更新中。</p>
            </div>
            <div class="footer-col">
                <h4>Dadaocheng Guide</h4>
                <p data-i18n="footer-desc2">所有店家資訊僅供參考，請以實際營業狀況為準。</p>
            </div>
        </div>
        <div class="feedback-section">
            <h4 style="margin-bottom: 8px;" data-i18n="feedback-title">改善地方建議</h4>
            <p data-i18n="feedback-sub">您的意見是讓大稻埕更好的動力！歡迎提出與指教為改善建議。</p>
            <div style="text-align: center; margin-top: 20px;">
                <a href="https://forms.gle/4DoTH5v3u52vj2FU9" target="_blank" rel="noopener noreferrer" class="submit-btn" style="text-decoration: none; display: inline-block;" data-i18n="feedback-btn">
                    前往填寫表單
                </a>
            </div>
        </div>
        <div class="copyright">© 2026 Dadaocheng Guide. All rights reserved.</div>
    </footer>

    <script>
        // 1. 宣告空陣列，用來存放從 JSON 抓回來的資料
        let shopData = [];

        // 2. 多語系翻譯字典
        const i18n = {
            "zh": {
                "site-title": "大稻埕特色店家", "nav-shops": "特色店家", "nav-apps": "必備APP推薦", "nav-emergency": "緊急協助",
                "cat-all": "全部", "cat-coffee": "咖啡", "cat-tea": "茶館", "cat-rest": "餐廳", "cat-craft": "文創選物", 
                "cat-pastry": "傳統糕餅", "cat-med": "中藥行", "cat-snack": "小吃飲品", "cat-bar": "酒吧", "cat-culture": "文化",
                "footer-desc1": "本指南由社群共編，持續更新中。", "footer-desc2": "所有店家資訊僅供參考，請以實際營業狀況為準。",
                "feedback-title": "改善地方建議", "feedback-sub": "您的意見是讓大稻埕更好的動力！歡迎提出與指教為改善建議。",
                "feedback-input": "請在此寫下您的建議或對網站的改善期待...", "feedback-btn": "送出建議",
                "tag-coffee": "咖啡", "tag-tea": "茶館", "tag-restaurant": "餐廳", "tag-craft": "文創選物",
                "tag-pastry": "傳統糕餅", "tag-medicine": "中藥行", "tag-snack": "小吃飲品", "tag-dessert": "小吃飲品",
                "tag-bar": "酒吧", "tag-culture": "文化", "page-text": "總共第 {start} 到 {end} 筆，共 {total} 筆"
            },
            "en": {
                "site-title": "Dadaocheng Shops", "nav-shops": "Featured Shops", "nav-apps": "Essential Apps", "nav-emergency": "Emergency Help",
                "cat-all": "All", "cat-coffee": "Coffee", "cat-tea": "Tea House", "cat-rest": "Restaurant", "cat-craft": "Crafts & Design", 
                "cat-pastry": "Traditional Pastry", "cat-med": "Chinese Medicine", "cat-snack": "Snacks & Drinks", "cat-bar": "Bar", "cat-culture": "Culture",
                "footer-desc1": "This guide is co-edited by the community and continuously updated.", "footer-desc2": "Store information is for reference only. Please check actual operating conditions.",
                "feedback-title": "Suggestions for Improvement", "feedback-sub": "Your feedback drives Dadaocheng forward! We welcome your suggestions.",
                "feedback-input": "Please write down your suggestions or expectations for the website...", "feedback-btn": "Submit",
                "tag-coffee": "Coffee", "tag-tea": "Tea House", "tag-restaurant": "Restaurant", "tag-craft": "Crafts",
                "tag-pastry": "Pastry", "tag-medicine": "Medicine", "tag-snack": "Snacks", "tag-dessert": "Dessert",
                "tag-bar": "Bar", "tag-culture": "Culture", "page-text": "Showing {start} to {end} of {total} entries"
            },
            "ja": {
                "site-title": "大稲埕のおすすめ店", "nav-shops": "おすすめ店", "nav-apps": "必須アプリ", "nav-emergency": "緊急サポート",
                "cat-all": "すべて", "cat-coffee": "カフェ", "cat-tea": "茶館", "cat-rest": "レストラン", "cat-craft": "文化クリエイティブ", 
                "cat-pastry": "伝統菓子", "cat-med": "漢方薬局", "cat-snack": "軽食・ドリンク", "cat-bar": "バー", "cat-culture": "文化",
                "footer-desc1": "このガイドはコミュニティによって共同編集・更新されています。", "footer-desc2": "店舗情報は参考用です。実際の営業状況をご確認ください。",
                "feedback-title": "改善のご提案", "feedback-sub": "皆様のご意見が、大稲埕をより良くする原動力です！",
                "feedback-input": "ウェブサイトへの改善のご提案やご期待をここにご記入ください...", "feedback-btn": "送信する",
                "tag-coffee": "カフェ", "tag-tea": "茶館", "tag-restaurant": "レストラン", "tag-craft": "クラフト",
                "tag-pastry": "伝統菓子", "tag-medicine": "漢方薬局", "tag-snack": "軽食", "tag-dessert": "スイーツ",
                "tag-bar": "バー", "tag-culture": "文化", "page-text": "全 {total} 件中 {start} から {end} 件目を表示"
            },
            "ko": {
                "site-title": "다다오청 추천 상점", "nav-shops": "추천 상점", "nav-apps": "필수 앱 추천", "nav-emergency": "긴급 지원",
                "cat-all": "전체", "cat-coffee": "카페", "cat-tea": "찻집", "cat-rest": "레스토랑", "cat-craft": "문화 창작", 
                "cat-pastry": "전통 과자", "cat-med": "한약방", "cat-snack": "스낵 및 음료", "cat-bar": "바", "cat-culture": "문화",
                "footer-desc1": "이 가이드는 커뮤니티가 공동으로 편집하며 지속적으로 업데이트됩니다.", "footer-desc2": "상점 정보는 참고용입니다. 실제 영업 상황을 확인해 주세요.",
                "feedback-title": "개선 제안", "feedback-sub": "여러분의 의견은 다다오청을 발전시키는 원동력입니다! 제안을 환영합니다.",
                "feedback-input": "웹사이트 개선을 위한 제안이나 기대 사항을 이곳에 적어주세요...", "feedback-btn": "제출하기",
                "tag-coffee": "카페", "tag-tea": "찻집", "tag-restaurant": "레스토랑", "tag-craft": "문화 창작",
                "tag-pastry": "전통 과자", "tag-medicine": "한약방", "tag-snack": "스낵", "tag-dessert": "디저트",
                "tag-bar": "바", "tag-culture": "문화", "page-text": "총 {total}개 중 {start}에서 {end}까지 표시"
            }
        };

        // 3. 變數狀態設定
        let currentLang = 'zh';
        let currentCategory = 'all';
        let currentPage = 1;
        const cardsPerPage = 9;

        // 4. 從 data.json 抓取資料
        fetch('data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('無法讀取檔案，請確認伺服器狀態');
                }
                return response.json();
            })
            .then(data => {
                shopData = data; 
                renderCards();   
            })
            .catch(error => {
                console.error('獲取 JSON 失敗:', error);
                document.getElementById('card-grid').innerHTML = 
                    `<p style="grid-column: 1/-1; text-align: center; color: red;">
                        資料讀取失敗！<br>
                        瀏覽器安全限制，直接點擊 HTML 檔案無法讀取外部 JSON。<br>
                        請使用 <b>VS Code 的 Live Server</b> 或其他本機伺服器來開啟這個網頁。
                    </p>`;
            });

        // 5. 初始化與事件監聽
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lang-select').addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateStaticText();
                renderCards();
            });

            const filterBtns = document.querySelectorAll('.filter-tag');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    currentPage = 1; 
                    renderCards();
                });
            });
        });

        // 6. 更新靜態文字
        function updateStaticText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang] && i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
            const textarea = document.getElementById('feedback-input');
            if (textarea && i18n[currentLang]['feedback-input']) {
                textarea.placeholder = i18n[currentLang]['feedback-input'];
            }
        }

        // 7. 渲染卡片與分頁
        function renderCards() {
            const cardGrid = document.getElementById('card-grid');
            
            let filteredData = shopData;
            if (currentCategory !== 'all') {
                filteredData = shopData.filter(item => {
                    // 把 dessert 也歸類在 snack 裡面
                    if (currentCategory === 'snack') {
                        return item.Category === 'snack' || item.Category === 'dessert';
                    }
                    return item.Category === currentCategory;
                });
            }

            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / cardsPerPage);
            const startIndex = (currentPage - 1) * cardsPerPage;
            const endIndex = startIndex + cardsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);

            cardGrid.innerHTML = '';

            const langKey = currentLang.toUpperCase(); 
            paginatedData.forEach(item => {
                const title = item[`Title (${langKey})`] || item[`Title (ZH)`];
                const address = item[`Address (${langKey})`] || item[`Address (ZH)`];
                const hours = item[`Hours (${langKey})`] || item[`Hours (ZH)`];
                const desc = item[`Description (${langKey})`] || item[`Description (ZH)`];
                const tagText = i18n[currentLang][`tag-${item.Category}`] || item.Category;

                // 將地址轉換為 Google Maps 搜尋連結（使用繁體中文的店名+地址定位最準確）
                const searchKeyword = encodeURIComponent(item['Title (ZH)'] + ' ' + item['Address (ZH)']);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;

                const cardHtml = `
                    <div class="shop-card">
                        <span class="shop-tag">${tagText}</span>
                        <h3>${title}</h3>
                        <p class="desc">${desc}</p>
                        <div class="card-info">
                            <div>
                                <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="map-link">
                                    <i class="fa-solid fa-location-dot"></i> ${address}
                                </a>
                            </div>
                            <div><i class="fa-regular fa-clock"></i> ${hours}</div>
                        </div>
                    </div>
                `;
                cardGrid.insertAdjacentHTML('beforeend', cardHtml);
            });

            updatePagination(totalItems, totalPages);
        }

        // 8. 更新分頁UI
        function updatePagination(totalItems, totalPages) {
            const paginationNumbers = document.getElementById('pagination-numbers');
            const pageInfo = document.getElementById('page-info');
            paginationNumbers.innerHTML = '';

            if (totalItems === 0) {
                pageInfo.innerText = i18n[currentLang]['page-text'].replace('{start}', 0).replace('{end}', 0).replace('{total}', 0);
                return;
            }

            const prevBtn = document.createElement('div');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left" style="font-size: 0.8em;"></i>';
            prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; renderCards(); }};
            paginationNumbers.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('div');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => { currentPage = i; renderCards(); };
                paginationNumbers.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('div');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i>';
            nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; renderCards(); }};
            paginationNumbers.appendChild(nextBtn);

            const startStr = (currentPage - 1) * cardsPerPage + 1;
            const endStr = Math.min(currentPage * cardsPerPage, totalItems);
            let infoText = i18n[currentLang]['page-text']
                .replace('{start}', startStr)
                .replace('{end}', endStr)
                .replace('{total}', totalItems);
            pageInfo.innerText = infoText;
        }
    </script>
</body>
</html>
